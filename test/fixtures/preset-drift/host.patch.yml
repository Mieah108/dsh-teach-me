# 夹具：模拟宿主 ptc.patch.yml（只保留被测结构）
- insert:
    - id: preset-ptc
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ptc
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: tool-a
            name: '@deepseek-ai/dsh-tool-a'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
