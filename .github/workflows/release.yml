name: Release

on:
  push:
    branches: [main]
    tags: ['v*', '*-public']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public release tag (leave blank to publish the current main version)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      github.repository == 'Mieah108/dsh-teach-me' && !github.event.deleted && !github.event.forced &&
      (github.ref == 'refs/heads/main' ||
       (github.event.repository.private == false && startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.4.0
          registry-url: https://registry.npmjs.org
      - name: Select release target
        id: target
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ "$PRIVATE_REPOSITORY" == true ]]; then
              echo 'Tag releases require a public GitHub repository. Use a main version commit for npm.'
              exit 0
            fi
            test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
            node scripts/version.mjs verify --release
            echo 'github_release=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
              echo 'Main has no previous commit. Use Run workflow to publish its first version.'
              exit 0
            fi
            node --input-type=module - "$PUSH_BEFORE" <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { compareVersions } from './scripts/version.mjs'
          const previous = JSON.parse(execFileSync('git', ['show', process.argv[2] + ':package.json'], { encoding: 'utf8' })).version
          const current = JSON.parse(readFileSync('package.json', 'utf8')).version
          const change = compareVersions(current, previous)
          if (change < 0) throw new Error('Package version decreased from ' + previous + ' to ' + current)
          if (change === 0) console.log('Package version is unchanged: ' + current)
          else appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n')
          NODE
            exit 0
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      # pnpm/action-setup@v4; version comes from packageManager.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.target.outputs.publish == 'true'
      - name: Pin npm with Trusted Publishing support
        if: steps.target.outputs.publish == 'true'
        run: npm install --global npm@11.17.0
      - name: Render GitHub release notes
        id: release
        if: steps.target.outputs.github_release == 'true'
        run: node scripts/release-notes.mjs --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
      - run: pnpm install --frozen-lockfile
        if: steps.target.outputs.publish == 'true'
      - run: pnpm verify:source
        if: steps.target.outputs.publish == 'true'
      - name: Export and verify release assets
        if: steps.target.outputs.publish == 'true'
        run: node scripts/export-release.mjs --output "$RUNNER_TEMP/release"
      - name: Dry run npm publication
        if: steps.target.outputs.publish == 'true'
        run: node scripts/publish-npm.mjs --directory "$RUNNER_TEMP/release" --dry-run
      - name: Publish verified runtime tarball to npm
        if: steps.target.outputs.publish == 'true'
        env:
          # Optional bootstrap credential; OIDC is used once configured on npm.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          args=(--directory "$RUNNER_TEMP/release" --publish)
          if [[ "$PRIVATE_REPOSITORY" == true ]]; then
            args+=(--no-provenance)
          fi
          node scripts/publish-npm.mjs "${args[@]}"
      - name: Create GitHub Release and attach verified assets
        if: steps.target.outputs.github_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          args=(--title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--prerelease=false --latest)
          fi
          assets=("$RUNNER_TEMP/release/"*.tar.gz "$RUNNER_TEMP/release/"*.tgz "$RUNNER_TEMP/release/release-manifest.json" "$RUNNER_TEMP/release/SHA256SUMS")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" "${args[@]}"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag "${args[@]}"
          fi
