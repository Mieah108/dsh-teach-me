name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.4.0
      # pnpm/action-setup@v4; version comes from packageManager.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:source
      - name: Verify source and runtime archives
        run: node scripts/export-release.mjs --output "$RUNNER_TEMP/release"
      - name: Dry run npm publication
        run: node scripts/publish-npm.mjs --directory "$RUNNER_TEMP/release" --dry-run
